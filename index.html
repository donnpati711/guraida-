<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a9def0" />
    <title>SKYBOUND — グライダー滑空ゲーム</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="SKYBOUND ホーム">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>SKYBOUND</span>
        </a>
        <span class="topbar-note">GLIDER FLIGHT · 01</span>
      </header>

      <section class="game-frame" aria-label="グライダー滑空ゲーム">
        <canvas id="game" aria-label="空を滑空するグライダーのゲーム画面"></canvas>

        <div class="hud" aria-live="polite">
          <div class="hud-stat">
            <span class="hud-label">高度</span>
            <strong><span id="altitude">0</span><small>m</small></strong>
          </div>
          <div class="hud-stat hud-distance">
            <span class="hud-label">飛行距離</span>
            <strong><span id="distance">0</span><small>m</small></strong>
          </div>
          <div class="hud-stat hud-speed">
            <span class="hud-label">速度</span>
            <strong><span id="speed">0</span><small>km/h</small></strong>
          </div>
          <div class="flight-status" id="flight-status">
            <span class="status-dot"></span>
            <span id="status-text">READY TO FLY</span>
          </div>
        </div>

        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <span class="eyebrow" id="overlay-eyebrow">YOUR SKY IS WAITING</span>
            <h1 id="overlay-title">風に乗ろう。</h1>
            <p id="overlay-copy">
              上昇気流をつかまえて、できるだけ遠くまで滑空しよう。
            </p>
            <button class="primary-button" id="start-button" type="button">
              <span id="button-label">フライト開始</span>
              <span aria-hidden="true">↗</span>
            </button>
            <div class="key-hint">
              <kbd>↑</kbd><kbd>↓</kbd><span>または</span><kbd>W</kbd><kbd>S</kbd>
              <span>で機首を操作</span>
            </div>
          </div>
        </div>

        <div class="touch-controls" aria-label="飛行操作">
          <button class="control-button" id="pitch-up" type="button" aria-label="機首を上げる">↑</button>
          <button class="control-button" id="pitch-down" type="button" aria-label="機首を下げる">↓</button>
        </div>
        <div class="scene-caption" aria-hidden="true">
          <span>ALPINE VALLEY</span><span class="caption-line"></span><span>晴れ・北西の風</span>
        </div>
      </section>

      <footer class="footer">
        <span>グライダーは風を味方にする。</span>
        <span>上昇気流 <i class="thermal-key" aria-hidden="true"></i></span>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
